[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ptools"
version = "0.1.0"
description = "Gentoo Portage configuration tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ptools = "ptools.cli:main"
puse = "ptools.compat.puse:main"
pkw = "ptools.compat.pkw:main"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (require specific environment)",
]
addopts = "--cov=ptools --cov-report=term-missing --cov-fail-under=85"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
omit = [
    "src/ptools/portage_adapter.py",
]
