[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ptools"
version = "1.0.0"
description = "Gentoo Portage configuration tools"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
# `ptools` is the distribution name, not a command: puse and pkw are the only
# things anyone types.
puse = "ptools.puse:main"
pkw = "ptools.pkw:main"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (require specific environment)",
]
addopts = "--cov=ptools --cov-report=term-missing --cov-fail-under=85"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
omit = [
    # Requires a real Gentoo host; exercised by the integration tests on gumbo.
    "src/ptools/portage_real.py",
]
