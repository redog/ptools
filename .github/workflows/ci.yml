# Generated/maintained by the gumbo-dev skill. Safe to hand-edit outside the
# "(managed)" blocks; those get regenerated on update.
name: CI

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      # One OS leg failing must not cancel the others.
      fail-fast: false
      matrix:
# >>> gumbo-dev:matrix (managed) — edit legs via the gumbo-dev skill
        include:
          - os: gentoo-dev
            runs-on: [self-hosted, gumbo, gentoo-dev]
            platform: linux
# <<< gumbo-dev:matrix

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

# >>> gumbo-dev:deps (managed) — edit system deps via the gumbo-dev skill
      - name: Verify toolchain (Gentoo)
        if: matrix.os == 'gentoo-dev'
        run: |
          # Python and portage ship with the Gentoo base container; nothing to
          # emerge. Fail fast if that assumption ever breaks.
          python --version
          python -c "import portage; print('portage', portage.VERSION)"
# <<< gumbo-dev:deps

      - name: Install ptools + test deps
        if: matrix.platform == 'linux'
        run: |
          # --system-site-packages so the venv can see the system `portage`
          # module (needed by portage_adapter / integration tests). Unit tests
          # use the mock backend and don't require it.
          python -m venv --system-site-packages .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov

      - name: Verify portage is visible inside the venv
        if: matrix.os == 'gentoo-dev'
        run: |
          . .venv/bin/activate
          # The integration suite is guarded by importorskip("portage"). If the
          # venv cannot see the system module the whole suite would skip and the
          # job would still go green, silently voiding milestones D and F. Fail
          # here instead, where the cause is obvious.
          python -c "import portage; print('portage', portage.VERSION)"

      - name: Run test suite
        if: matrix.platform == 'linux'
        run: |
          . .venv/bin/activate
          # pyproject bakes in --cov=ptools --cov-fail-under=85
          pytest

      - name: Assert the integration suite actually ran
        if: matrix.os == 'gentoo-dev'
        run: |
          . .venv/bin/activate
          # A skipped integration test is not a passing one. Milestone F needs
          # real-portage coverage on this host, so treat any skip as a failure.
          # --no-cov: pyproject bakes in --cov-fail-under=85, which the
          # integration tests alone cannot meet. The full run above owns the
          # coverage gate; this run only proves the suite executed.
          pytest -m integration -q --no-cov --junitxml=integration.xml
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET

          suite = ET.parse("integration.xml").getroot().find("testsuite")
          ran = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          print(f"integration: {ran} collected, {skipped} skipped")
          if ran == 0 or skipped:
              sys.exit("integration tests did not run against real portage")
          PY

      - name: Discover real environment
        if: matrix.os == 'gentoo-dev'
        run: |
          . .venv/bin/activate
          # Milestone D: the output of this step is what docs/environment.md
          # records. It only reads portage settings; it writes nothing.
          python scripts/discover_environment.py | tee environment.md

      - name: Upload environment discovery
        if: matrix.os == 'gentoo-dev'
        uses: actions/upload-artifact@v4
        with:
          name: environment-${{ matrix.os }}
          path: environment.md
